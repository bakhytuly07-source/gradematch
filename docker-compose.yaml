services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gradematch}
      POSTGRES_USER: ${POSTGRES_USER:-gradematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradematch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gradematch}:${POSTGRES_PASSWORD:-gradematch}@db:5432/${POSTGRES_DB:-gradematch}
    ports:
      - "8091:8091"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/docs', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
