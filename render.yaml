services:
  - type: web
    name: gradematch-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gradematch-db
          property: connectionString

databases:
  - name: gradematch-db
    plan: free
    region: frankfurt
