services:
  - type: web
    name: gradematch-web
    autoDeployTrigger: checksPass
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /docs
    envVars:
      - key: DEPLOYMENT_ENVIRONMENT
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: gradematch-db
          property: connectionString

  - type: web
    name: gradematch-prod
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /docs
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEPLOYMENT_ENVIRONMENT
        value: prod

databases:
  - name: gradematch-db
    plan: free
    region: frankfurt
